# dsh plugin add 后,把下面这段合并进 profile 的 cordis.patch.yml
#(~/.dsh/profiles/web/cordis.patch.yml),config 按你的部署改。
# CF Worker 网关 + P2P 形态:网关(dsh-gateway-worker,如 dsh.pan2017.cn)
# 只做配对 + 信令;业务流量手机↔Mac WebRTC 直连,零中转、零隧道、零 ssh。
#
# 目录浏览钉死(移动端在 App 里选宿主文件夹/添加工作区):官方 auto 选择器在
# 桌面形态(loopback 绑定 + GUI 会话启动)解析成 native —— 宿主屏弹 OS 对话框,
# 远程客户端无法驱动,host.listDirectory / host.createDirectory 会被服务端拒绝
# (directory-picker-unavailable)。服务移动端的主机禁用 auto 行,改挂 browse
# 交互(后端 + web 前端成对,缺一不可:只挂后端会让桌面 web 的入口消失)。
# 代价:桌面 web「添加工作区」也从 OS 对话框变成网页内浏览。
- id: directory-picker
  disabled: true
- insert:
    - id: directory-picker-browse
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
    - id: ui-directory-picker-browse
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'
    - id: dsh-mobile
      name: 'dsh-mobile'
      config:
        gateway: https://dsh.example.com       # CF Worker 网关地址(Deploy Button 部署产物)
        adminKey: '<ADMIN_KEY>'                # 部署 Worker 时的管理密钥(≥16 字符)
        host: mac-01.p2p                       # 宿主路由键(多宿主各占一个;缺省 <短主机名>.p2p)
        # publicUrl: 缺省 <gateway>/pair(扫码落地页);iceServers 可选(JSON 数组字符串,缺省公共 STUN)
